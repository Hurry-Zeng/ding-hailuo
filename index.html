<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#061b36">
  <title>海螺 - 华城国际匿名反馈</title>
  <style>
    :root {
      --ink: #10233f;
      --muted: #66758c;
      --line: #dce6f5;
      --paper: #f7faff;
      --white: #ffffff;
      --navy: #061b36;
      --navy-2: #0a2b50;
      --cyan: #46d9ff;
      --blue: #2476f5;
      --violet: #7c3aed;
      --violet-dark: #6728d8;
      --danger: #d83b4d;
      --shadow: 0 18px 50px rgba(4, 23, 49, 0.18);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #dce8f5;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(70, 217, 255, 0.45);
      outline-offset: 2px;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 100svh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 0 70px rgba(5, 26, 55, 0.2);
    }

    .view {
      display: none;
      min-height: 100svh;
    }

    .view.is-active {
      display: block;
      animation: view-in 260ms ease-out both;
    }

    @keyframes view-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .view-home {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      color: var(--white);
      background: var(--navy);
    }

    .home-backdrop {
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: url("./assets/hero-shell.jpg");
      background-position: center bottom;
      background-size: cover;
      background-repeat: no-repeat;
      transform: scale(1.015);
    }

    .home-shade {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(3, 16, 38, 0.76) 0%, rgba(4, 22, 52, 0.25) 42%, rgba(4, 18, 41, 0.88) 100%),
        linear-gradient(90deg, rgba(5, 21, 49, 0.55), rgba(5, 21, 49, 0.08));
    }

    .home-inner {
      position: relative;
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 20px) 22px calc(var(--safe-bottom) + 22px);
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      font-weight: 750;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 8px;
      background: rgba(19, 73, 137, 0.62);
      color: #9ceaff;
      font-size: 14px;
      font-weight: 800;
      box-shadow: inset 0 0 18px rgba(70, 217, 255, 0.1);
    }

    .brand-name {
      font-size: 16px;
    }

    .brand-tag {
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(3, 17, 39, 0.36);
      color: rgba(255, 255, 255, 0.86);
      font-size: 12px;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }

    .hero-copy {
      margin-top: auto;
      margin-bottom: auto;
      padding: 110px 0 40px;
      text-align: center;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.42);
    }

    .hero-eyebrow {
      margin: 0 0 12px;
      color: #d4b875;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-style: italic;
    }

    .hero-title {
      margin: 0;
      color: var(--white);
      font-size: 104px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 0.04em;
    }

    .hero-slogan {
      margin: 18px 0 0;
      color: var(--white);
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0.1em;
    }

    .hero-caption {
      max-width: 290px;
      margin: 12px auto 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
      line-height: 1.65;
    }

    .home-bottom {
      width: 100%;
    }

    .home-note {
      margin: 0 0 14px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      text-align: center;
    }

    .home-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .home-button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 999px;
      color: var(--white);
      font-size: 17px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(1, 15, 36, 0.35);
      transition: transform 160ms ease, filter 160ms ease;
    }

    .home-button:active {
      transform: scale(0.98);
      filter: brightness(0.96);
    }

    .home-button.primary {
      background: var(--violet);
    }

    .home-button.secondary {
      background: var(--blue);
    }

    .icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .view-form,
    .view-success {
      background:
        radial-gradient(circle at 92% 2%, rgba(70, 217, 255, 0.2), transparent 28%),
        linear-gradient(180deg, #071f40 0, #0b2d58 180px, #edf5ff 180px, #f8fbff 100%);
    }

    .view-topbar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      min-height: 60px;
      align-items: center;
      gap: 8px;
      padding: var(--safe-top) 14px 0;
      color: var(--white);
    }

    .view-topbar h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 720;
      text-align: center;
    }

    .icon-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: inherit;
      cursor: pointer;
    }

    .form-wrap {
      width: calc(100% - 28px);
      max-width: 452px;
      margin: 14px auto 0;
      padding: 20px 18px calc(var(--safe-bottom) + 24px);
      border: 1px solid rgba(188, 218, 248, 0.6);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: var(--shadow);
    }

    .form-intro {
      padding: 4px 2px 18px;
      border-bottom: 1px solid var(--line);
    }

    .form-intro strong {
      display: block;
      color: #15375f;
      font-size: 20px;
      line-height: 1.4;
    }

    .form-intro p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .field-group {
      margin: 22px 0 0;
      padding: 0;
      border: 0;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
      color: #203956;
      font-size: 14px;
      font-weight: 720;
    }

    .required {
      color: var(--danger);
    }

    .field-hint {
      color: #8a99ae;
      font-size: 12px;
      font-weight: 500;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .category-button {
      min-height: 44px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f5f9ff;
      color: #52657e;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
    }

    .category-button.is-selected {
      border-color: #7251e8;
      background: #f0ebff;
      color: #6032cd;
      box-shadow: inset 0 0 0 1px rgba(114, 81, 232, 0.1);
    }

    .textarea-wrap {
      position: relative;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 178px;
      resize: vertical;
      border: 1px solid #d9e5f2;
      border-radius: 14px;
      background: #f5f9fe;
      color: var(--ink);
      padding: 15px 15px 34px;
      line-height: 1.65;
    }

    textarea::placeholder,
    input::placeholder {
      color: #9aa8ba;
    }

    .char-count {
      position: absolute;
      right: 13px;
      bottom: 10px;
      color: #8a99ae;
      font-size: 12px;
      pointer-events: none;
    }


    .captcha-row {
      display: grid;
      grid-template-columns: 1fr 112px;
      gap: 10px;
    }

    .captcha-row input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #d9e5f2;
      border-radius: 12px;
      background: #f5f9fe;
      padding: 0 14px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 650;
      letter-spacing: 0.2em;
    }

    .captcha-box {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
      border: 1px solid #cddff3;
      border-radius: 12px;
      background: #eef6ff;
      cursor: pointer;
    }

    .captcha-char {
      display: inline-block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
    }

    .captcha-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 7px;
    }

    .text-button {
      min-height: 34px;
      padding: 0 4px;
      border: 0;
      background: transparent;
      color: #536b87;
      font-size: 12px;
      cursor: pointer;
    }

    .privacy-note {
      display: flex;
      gap: 9px;
      margin: 18px 0 0;
      padding: 11px 12px;
      border: 1px solid #dce9f8;
      border-radius: 12px;
      background: #f4f9ff;
      color: #667b95;
      font-size: 12px;
      line-height: 1.6;
    }

    .privacy-note .icon {
      width: 17px;
      height: 17px;
      margin-top: 1px;
      color: #3f78b8;
    }

    .form-message {
      display: none;
      margin: 14px 0 0;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
    }

    .form-message.is-visible {
      display: block;
    }

    .form-message.is-error {
      border: 1px solid #f2c2c8;
      background: #fff3f4;
      color: #b62f40;
    }

    .form-message.is-success {
      border: 1px solid #bde5cc;
      background: #effaf3;
      color: #237244;
    }

    .submit-button {
      display: inline-flex;
      width: 100%;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      border: 0;
      border-radius: 999px;
      background: var(--violet);
      color: var(--white);
      font-size: 17px;
      font-weight: 780;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(101, 50, 201, 0.3);
      transition: transform 160ms ease, filter 160ms ease, opacity 160ms ease;
    }

    .submit-button:active {
      transform: scale(0.985);
      filter: brightness(0.96);
    }

    .submit-button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .submit-button .icon {
      width: 23px;
      height: 23px;
    }

    .is-loading .icon {
      animation: spin 900ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .success-wrap {
      display: flex;
      width: calc(100% - 28px);
      max-width: 452px;
      min-height: calc(100svh - 90px - var(--safe-top) - var(--safe-bottom));
      margin: 16px auto 0;
      align-items: center;
      justify-content: center;
      padding-bottom: calc(var(--safe-bottom) + 24px);
    }

    .success-card {
      width: 100%;
      padding: 30px 22px 22px;
      border: 1px solid #d9e6f5;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .success-icon {
      display: grid;
      width: 66px;
      height: 66px;
      margin: 0 auto 16px;
      place-items: center;
      border-radius: 999px;
      background: #eaf8f0;
      color: #2a9d59;
    }

    .success-icon .icon {
      width: 34px;
      height: 34px;
      stroke-width: 2.4;
    }

    .success-card h3 {
      margin: 0;
      color: #173b63;
      font-size: 24px;
    }

    .success-card > p {
      margin: 9px 0 0;
      color: #6a7c93;
      font-size: 14px;
      line-height: 1.7;
    }

    .code-panel {
      margin-top: 22px;
      padding: 16px 14px;
      border: 1px solid #d9d3fb;
      border-radius: 14px;
      background: #f5f1ff;
    }

    .code-label {
      display: block;
      color: #765ca4;
      font-size: 12px;
    }

    .code-value {
      display: block;
      margin-top: 7px;
      color: #5428ad;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.35;
      word-break: break-all;
    }

    .copy-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 13px;
      padding: 0 16px;
      border: 1px solid #cdbff4;
      border-radius: 999px;
      background: var(--white);
      color: #6337bf;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .success-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    .secondary-button {
      min-height: 48px;
      border: 1px solid #d9e5f2;
      border-radius: 999px;
      background: #f6f9fd;
      color: #29445f;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 28px);
      z-index: 20;
      max-width: min(430px, calc(100vw - 40px));
      transform: translate(-50%, 18px);
      padding: 11px 15px;
      border-radius: 999px;
      background: rgba(8, 28, 53, 0.93);
      color: var(--white);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 360px) {
      .hero-title {
        font-size: 90px;
      }

      .hero-copy {
        padding-top: 86px;
      }

      .home-actions {
        grid-template-columns: 1fr;
      }

      .category-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
    .brand-mark {
      overflow: hidden;
      background: #ffffff;
      color: transparent;
      font-size: 0;
    }

    .brand-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="view view-home is-active" id="viewHome" aria-label="海螺首页">
      <div class="home-backdrop" aria-hidden="true"></div>
      <div class="home-shade" aria-hidden="true"></div>
      <div class="home-inner">
        <header class="brand-bar">
          <div class="brand">
            <span class="brand-mark">
              <img src="./assets/app-icon.png" alt="">
            </span>
            <span class="brand-name">华城国际</span>
          </div>
          <span class="brand-tag">匿名反馈</span>
        </header>

        <div class="hero-copy">
          <p class="hero-eyebrow">Listen to your heart</p>
          <h1 class="hero-title">海螺</h1>
          <p class="hero-slogan">倾听涟漪，共筑未来</p>
          <p class="hero-caption">让每一条真实的声音，被安全地听见。</p>
        </div>

        <div class="home-bottom">
          <p class="home-note">无需填写姓名、工号或部门信息</p>
          <div class="home-actions">
            <button class="home-button primary" id="openFormButton" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5"></path>
                <path d="m5 12 7-7 7 7"></path>
              </svg>
              扔海螺
            </button>
            <button class="home-button secondary" id="openQueryButton" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              捡海螺
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="viewForm" aria-label="填写反馈">
      <header class="view-topbar">
        <button class="icon-button" id="formBackButton" type="button" aria-label="返回首页">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 18-6-6 6-6"></path>
          </svg>
        </button>
        <h2>扔出一枚海螺</h2>
        <span aria-hidden="true"></span>
      </header>

      <form class="form-wrap" id="feedbackForm" novalidate>
        <div class="form-intro">
          <strong>Hi，我是小海螺</strong>
          <p>任何你想说的话，都可以在这里告诉我们。</p>
        </div>

        <fieldset class="field-group">
          <legend class="field-label">
            <span>投诉分类 <span class="required">*</span></span>
          </legend>
          <div class="category-grid" id="categoryGrid" role="radiogroup" aria-label="投诉分类">
            <button class="category-button" type="button" role="radio" aria-checked="false" data-value="行政">行政</button>
            <button class="category-button" type="button" role="radio" aria-checked="false" data-value="人事">人事</button>
            <button class="category-button" type="button" role="radio" aria-checked="false" data-value="业务">业务</button>
            <button class="category-button" type="button" role="radio" aria-checked="false" data-value="其他">其他</button>
          </div>
        </fieldset>

        <div class="field-group">
          <label class="field-label" for="descriptionInput">
            <span>问题描述 <span class="required">*</span></span>
            <span class="field-hint">至少 5 个字</span>
          </label>
          <div class="textarea-wrap">
            <textarea id="descriptionInput" maxlength="1000" placeholder="请尽量描述清楚事情经过、时间和涉及事项..."></textarea>
            <span class="char-count" id="charCount">0/1000</span>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="captchaInput">
            <span>验证码 <span class="required">*</span></span>
          </label>
          <div class="captcha-row">
            <input id="captchaInput" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="请输入验证码">
            <button class="captcha-box" id="captchaBox" type="button" aria-label="刷新验证码"></button>
          </div>
          <div class="captcha-actions">
            <button class="text-button" id="captchaRefreshButton" type="button">看不清？换一张</button>
          </div>
        </div>

        <div class="privacy-note">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
          <span>提交内容不包含姓名、工号、部门等员工身份信息。</span>
        </div>

        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

        <button class="submit-button" id="submitButton" type="submit">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 19V5"></path>
            <path d="m5 12 7-7 7 7"></path>
          </svg>
          <span id="submitButtonText">扔出海螺</span>
        </button>
      </form>
    </section>

    <section class="view view-success" id="viewSuccess" aria-label="提交成功">
      <header class="view-topbar">
        <button class="icon-button" id="successHomeButton" type="button" aria-label="返回首页">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 11 9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>
          </svg>
        </button>
        <h2>提交结果</h2>
        <span aria-hidden="true"></span>
      </header>

      <div class="success-wrap">
        <div class="success-card">
          <div class="success-icon">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m20 6-11 11-5-5"></path>
            </svg>
          </div>
          <h3>海螺已经收到</h3>
          <p>感谢你的信任。请妥善保存下面的查询码，后续可用于查询处理进度。</p>

          <div class="code-panel">
            <span class="code-label">唯一查询码</span>
            <strong class="code-value" id="queryCodeText"></strong>
            <button class="copy-button" id="copyCodeButton" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
              </svg>
              复制查询码
            </button>
          </div>

          <div class="success-actions">
            <button class="secondary-button" id="submitAnotherButton" type="button">再扔一枚</button>
            <button class="secondary-button" id="successHomeBottomButton" type="button">返回首页</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      /*
       * 部署前只需要修改这里：
       * 1. webhookUrl 填钉钉连接流生成的 Webhook 地址。
       * 2. demoMode 改为 false。
       */
      const APP_CONFIG = {
        webhookUrl: "",
        demoMode: true,
        duplicateWindowMs: 60 * 1000
      };

      const state = {
        category: "",
        captcha: "",
        queryCode: "",
        submitting: false,
      };

      const viewHome = document.getElementById("viewHome");
      const viewForm = document.getElementById("viewForm");
      const viewSuccess = document.getElementById("viewSuccess");
      const form = document.getElementById("feedbackForm");
      const categoryGrid = document.getElementById("categoryGrid");
      const descriptionInput = document.getElementById("descriptionInput");
      const charCount = document.getElementById("charCount");
      const captchaInput = document.getElementById("captchaInput");
      const captchaBox = document.getElementById("captchaBox");
      const captchaRefreshButton = document.getElementById("captchaRefreshButton");
      const formMessage = document.getElementById("formMessage");
      const submitButton = document.getElementById("submitButton");
      const submitButtonText = document.getElementById("submitButtonText");
      const queryCodeText = document.getElementById("queryCodeText");
      const toast = document.getElementById("toast");

      let toastTimer = 0;

      function showView(target) {
        [viewHome, viewForm, viewSuccess].forEach((view) => {
          view.classList.toggle("is-active", view === target);
        });
        window.scrollTo(0, 0);
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("is-visible");
        toastTimer = window.setTimeout(() => {
          toast.classList.remove("is-visible");
        }, 2600);
      }

      function setFormMessage(message, type) {
        formMessage.textContent = message || "";
        formMessage.className = "form-message";
        if (message) {
          formMessage.classList.add("is-visible", type === "success" ? "is-success" : "is-error");
        }
      }

      function chooseCategory(value) {
        state.category = value;
        categoryGrid.querySelectorAll(".category-button").forEach((button) => {
          const selected = button.dataset.value === value;
          button.classList.toggle("is-selected", selected);
          button.setAttribute("aria-checked", selected ? "true" : "false");
        });
      }

      function resetForm() {
        form.reset();
        state.category = "";
        state.queryCode = "";
        state.submitting = false;
        chooseCategory("");
        descriptionInput.value = "";
        charCount.textContent = "0/1000";
        generateCaptcha();
        setFormMessage("", "");
        setSubmitLoading(false);
      }

      function setSubmitLoading(isLoading) {
        state.submitting = isLoading;
        submitButton.disabled = isLoading;
        submitButton.classList.toggle("is-loading", isLoading);
        submitButtonText.textContent = isLoading ? "正在扔出..." : "扔出海螺";
      }

      function randomBytes(length) {
        const bytes = new Uint8Array(length);
        if (window.crypto && window.crypto.getRandomValues) {
          window.crypto.getRandomValues(bytes);
          return bytes;
        }
        for (let index = 0; index < length; index += 1) {
          bytes[index] = Math.floor(Math.random() * 256);
        }
        return bytes;
      }

      function randomFromAlphabet(length, alphabet) {
        const bytes = randomBytes(length);
        let result = "";
        for (let index = 0; index < length; index += 1) {
          result += alphabet[bytes[index] % alphabet.length];
        }
        return result;
      }

      function generateClientToken() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        const hex = Array.from(randomBytes(16), (value) => value.toString(16).padStart(2, "0")).join("");
        return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-4${hex.slice(13, 16)}-a${hex.slice(17, 20)}-${hex.slice(20)}`;
      }

      function generateQueryCode() {
        const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        const body = randomFromAlphabet(20, alphabet);
        const groups = body.match(/.{1,4}/g) || [];
        return `HS-${groups.join("-")}`;
      }

      function generateCaptcha() {
        const alphabet = "23456789";
        state.captcha = randomFromAlphabet(4, alphabet);
        captchaInput.value = "";
        renderCaptcha();
      }

      function renderCaptcha() {
        const colors = ["#7047c8", "#db4a68", "#287dc6", "#2b9464"];
        captchaBox.replaceChildren();
        state.captcha.split("").forEach((char, index) => {
          const span = document.createElement("span");
          span.className = "captcha-char";
          span.textContent = char;
          span.style.color = colors[(index + Number(char)) % colors.length];
          span.style.transform = `rotate(${[-8, 6, -4, 7][index]}deg)`;
          captchaBox.appendChild(span);
        });
      }

      function validateForm() {
        if (!state.category) {
          return "请选择投诉分类";
        }
        const description = descriptionInput.value.trim();
        if (description.length < 5) {
          return "问题描述至少需要 5 个字";
        }
        if (description.length > 1000) {
          return "问题描述不能超过 1000 个字";
        }
        if (captchaInput.value.trim() !== state.captcha) {
          return "验证码不正确";
        }
        return "";
      }

      function submitPayload(payload) {
        if (APP_CONFIG.demoMode) {
          return new Promise((resolve) => window.setTimeout(resolve, 900));
        }

        if (!APP_CONFIG.webhookUrl || APP_CONFIG.webhookUrl.includes("请替换")) {
          return Promise.reject(new Error("尚未配置连接流 Webhook 地址"));
        }

        return fetch(APP_CONFIG.webhookUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload),
          credentials: "omit",
          mode: "cors",
          cache: "no-store"
        }).then((response) => {
          if (!response.ok) {
            throw new Error(`提交失败，服务返回 ${response.status}`);
          }
          return response;
        });
      }

      async function handleSubmit(event) {
        event.preventDefault();
        if (state.submitting) {
          return;
        }

        const validationError = validateForm();
        if (validationError) {
          setFormMessage(validationError, "error");
          return;
        }

        const lastSubmitAt = Number(window.sessionStorage.getItem("haixuo.lastSubmitAt") || 0);
        const elapsed = Date.now() - lastSubmitAt;
        if (elapsed < APP_CONFIG.duplicateWindowMs) {
          const seconds = Math.ceil((APP_CONFIG.duplicateWindowMs - elapsed) / 1000);
          setFormMessage(`请勿重复提交，${seconds} 秒后再试`, "error");
          return;
        }

        const queryCode = generateQueryCode();
        const payload = {
          action: "submit",
          schemaVersion: 1,
          category: state.category,
          description: descriptionInput.value.trim(),
          queryCode,
          clientToken: generateClientToken(),
          clientSubmittedAt: new Date().toISOString()
        };

        setSubmitLoading(true);
        setFormMessage("正在安全提交，请稍候...", "success");

        try {
          await submitPayload(payload);
          window.sessionStorage.setItem("haixuo.lastSubmitAt", String(Date.now()));
          state.queryCode = queryCode;
          queryCodeText.textContent = queryCode;
          setFormMessage("", "");
          showView(viewSuccess);
        } catch (error) {
          setFormMessage(error.message || "提交失败，请稍后重试", "error");
        } finally {
          setSubmitLoading(false);
        }
      }

      async function copyQueryCode() {
        const code = state.queryCode || queryCodeText.textContent;
        if (!code) {
          return;
        }

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(code);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = code;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            textarea.remove();
          }
          showToast("查询码已复制");
        } catch (error) {
          showToast("复制失败，请长按查询码手动复制");
        }
      }

      descriptionInput.addEventListener("input", () => {
        charCount.textContent = `${descriptionInput.value.length}/1000`;
      });

      categoryGrid.addEventListener("click", (event) => {
        const button = event.target.closest(".category-button");
        if (!button) {
          return;
        }
        chooseCategory(button.dataset.value || "");
      });

      captchaBox.addEventListener("click", generateCaptcha);
      captchaRefreshButton.addEventListener("click", generateCaptcha);
      form.addEventListener("submit", handleSubmit);

      document.getElementById("openFormButton").addEventListener("click", () => {
        resetForm();
        showView(viewForm);
      });

      document.getElementById("openQueryButton").addEventListener("click", () => {
        showToast("查询功能暂未开放，请先保存提交后的查询码");
      });

      document.getElementById("formBackButton").addEventListener("click", () => showView(viewHome));
      document.getElementById("successHomeButton").addEventListener("click", () => showView(viewHome));
      document.getElementById("successHomeBottomButton").addEventListener("click", () => showView(viewHome));
      document.getElementById("submitAnotherButton").addEventListener("click", () => {
        resetForm();
        showView(viewForm);
      });
      document.getElementById("copyCodeButton").addEventListener("click", copyQueryCode);

      generateCaptcha();
    })();
  </script>
</body>
</html>
